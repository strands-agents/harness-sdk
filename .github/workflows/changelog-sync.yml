name: "Changelog: Sync"

on:
  release:
    types: [published]
  schedule:
    # Backstop for missed release events, and the only same-day path for evals
    # and box releases (neither can dispatch cross-repo with its GITHUB_TOKEN,
    # and the bot PAT has no write here). skip-existing makes a no-op run
    # nearly free, so a 2-hourly cadence caps changelog lag at ~2h.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to re-render even if its file exists (optional)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  sync:
    # Upstream only: this workflow also exists on the bot fork (the fork mirrors
    # main), where the cron would otherwise fire and fail -- the fork has no
    # CHANGELOG_BOT_TOKEN secret.
    # On release: only our in-scope tag prefixes. The bare `v` prefix is for
    # pre-monorepo python releases; the action itself rejects any tag that
    # isn't `v<digit>`, so a stray non-version `v…` tag produces a no-op run.
    # Cron/dispatch: always run.
    if: >
      github.repository == 'strands-agents/harness-sdk' &&
      (github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'python/v') ||
      startsWith(github.event.release.tag_name, 'typescript/v') ||
      startsWith(github.event.release.tag_name, 'harness-python/v') ||
      startsWith(github.event.release.tag_name, 'harness-typescript/v') ||
      startsWith(github.event.release.tag_name, 'harness-cli/v') ||
      startsWith(github.event.release.tag_name, 'v'))
    runs-on: strands-agents_ubuntu-latest_4-core
    # Every run rebuilds the one rolling PR branch, so runs are serialized. A
    # queued run that GitHub replaces with a newer one loses nothing: each run
    # generates everything still missing from main.
    concurrency:
      group: changelog-sync
      cancel-in-progress: false
    # The PAT (CHANGELOG_BOT_TOKEN) performs every write -- checkout, the
    # github-script reads, and the branch push + PR creation all use it, not the
    # default GITHUB_TOKEN. So GITHUB_TOKEN needs only read; keeping write here
    # would be dead, misleading privilege.
    permissions:
      contents: read
    env:
      SYNC_BRANCH: changelog/sync
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci --prefix site

      # Keep the bot fork's default branch current with upstream before opening
      # PRs from it. create-pull-request cuts the PR branch from the fork's base;
      # if the fork is behind, the branch diff picks up files that changed
      # upstream since. Requires the PAT to carry the `workflow` scope --
      # see CHANGELOG-SYNC.md (token scopes + recovery runbook).
      # continue-on-error: a failed/flaky sync (409 divergence, transient API
      # hiccup) must not abort a run that would otherwise succeed -- if the sync
      # was actually needed, the create-pull-request push below fails anyway with
      # the underlying error. The step still surfaces as a visible annotation.
      - name: Sync bot fork with upstream
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_BOT_TOKEN }}
        run: gh api repos/strands-agent/harness-sdk/merge-upstream -f branch=main

      # One rolling PR for every source: create-pull-request rebuilds the branch
      # from main on each run, so each run must regenerate everything still
      # missing from main. Restoring what the PR branch changed since its base
      # keeps reviewer edits and re-renders (without reverting newer main
      # changes), and makes the skip-existing runs below only add new releases.
      # Non-fatal: without the restore, the run still syncs; it only loses edits.
      - name: Restore files from the open sync PR
        continue-on-error: true
        run: |
          git fetch --no-tags https://github.com/strands-agent/harness-sdk.git "$SYNC_BRANCH" || exit 0
          git diff --name-only --diff-filter=AM HEAD...FETCH_HEAD -- site/src/content/changelog \
            | xargs -r git checkout FETCH_HEAD --

      - name: Generate missing harness-sdk changelog files
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGELOG_BOT_TOKEN }}
          SOURCE_REPO: strands-agents/harness-sdk
          MODE: backfill
          SKIP_EXISTING: 'true'
        run: npm run changelog:sync

      # A manual dispatch for an already-synced tag re-renders that file
      # (curated highlights are preserved).
      - name: Re-sync the requested tag
        if: inputs.tag != ''
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGELOG_BOT_TOKEN }}
          SOURCE_REPO: strands-agents/harness-sdk
          MODE: single
          TAG: ${{ inputs.tag }}
        run: npm run changelog:sync

      # Evals and box release from their own repos, which cannot dispatch this
      # workflow, so every run backfills them too. A failure in one source must
      # not block the others.
      - name: Generate missing evals changelog files
        if: success() || failure()
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGELOG_BOT_TOKEN }}
          SOURCE_REPO: strands-agents/evals
          MODE: backfill
          SKIP_EXISTING: 'true'
        run: npm run changelog:sync

      - name: Generate missing box changelog files
        if: success() || failure()
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGELOG_BOT_TOKEN }}
          SOURCE_REPO: strands-agents/box
          MODE: backfill
          SKIP_EXISTING: 'true'
        run: npm run changelog:sync

      - name: List pending releases
        id: pending
        if: success() || failure()
        run: |
          {
            echo 'list<<EOF'
            git status --porcelain --untracked-files=all -- site/src/content/changelog | awk '{print "- `" $2 "`"}'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # Dedicated agent account (outside the org): a classic PAT with the
      # public_repo scope. Authors the PR as a real user, so the PR triggers
      # the required CI Gate (unlike github.token, whose PRs don't).
      # Account can't push to upstream directly, so the branch lands on its
      # fork and the PR is opened cross-repo against target-repo. Note:
      # `strands-agent` is SINGULAR -- the dedicated bot account, distinct
      # from the `strands-agents` (plural) org. Not a typo.
      - name: Open or update the changelog PR
        if: success() || failure()
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.CHANGELOG_BOT_TOKEN }}
          push-to-fork: strands-agent/harness-sdk
          add-paths: site/src/content/changelog/**
          branch: ${{ env.SYNC_BRANCH }}
          title: "docs(changelog): sync release notes"
          commit-message: "docs(changelog): sync release notes"
          body: |
            Automated changelog sync. Merge this before deploying the docs site:
            the docs deploy fails while a published release has no changelog file.

            Pending releases:
            ${{ steps.pending.outputs.list }}

            Add a curated `highlights:` block to any release file before merging if
            desired. Later syncs keep edits made on this branch.
          delete-branch: true
