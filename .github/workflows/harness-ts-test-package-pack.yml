name: "Harness TypeScript: Test Package Pack"

# End-to-end package install smoke test for harness-ts (`@strands-agents/harness`).
# Reusable; called by release-harness-ts.yml. Mirrors the SDK's
# typescript-test-package-pack.yml: `npm pack` the library, install the tarball in
# a tempdir OUTSIDE the repo tree (so nothing hoists), then import the public
# surface as a real consumer would. harness-ts installs standalone against the
# published @strands-agents/sdk (its own package-lock.json), not the repo-root
# workspace.

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        description: 'If set, stamp the tarball with this version via `npm version --no-git-tag-version`. Required at release time; PR-time callers leave this empty.'
        required: false
        type: string
        default: ''

jobs:
  test-package-pack:
    name: Pack Install
    permissions:
      contents: read
    runs-on: strands-agents_ubuntu-latest_4-core
    defaults:
      run:
        working-directory: harness-ts
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Stamp version (release only)
        env:
          PINNED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$PINNED_VERSION" ]; then
            echo "Stamping $PINNED_VERSION into package.json"
            npm version "$PINNED_VERSION" --no-git-tag-version
          else
            echo "No version pinned; packing with package.json as-committed."
          fi

      - name: Build
        run: npm run build

      - name: Pack, install in a tmpdir, import the public surface
        # The tmpdir MUST live outside the monorepo so nothing hoists into
        # resolution. harness-ts is ESM (type: module), so import() it.
        run: |
          set -euo pipefail
          TARBALL=$(npm pack --silent)
          TARBALL_PATH="$GITHUB_WORKSPACE/harness-ts/$TARBALL"
          echo "Packed: $TARBALL_PATH"

          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          cd "$WORK"
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL_PATH"
          node --input-type=module -e "
            const m = await import('@strands-agents/harness');
            if (typeof m.createHarness !== 'function') {
              throw new Error('createHarness export missing from @strands-agents/harness');
            }
            console.log('import OK: createHarness present');
          "

      - name: Upload tarball for downstream inspect/publish
        uses: actions/upload-artifact@v7.0.1
        with:
          name: harness-npm-build-output
          path: harness-ts/*.tgz
          if-no-files-found: error
          retention-days: 7
