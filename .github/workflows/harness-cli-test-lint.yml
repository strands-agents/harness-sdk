name: 'Harness CLI: Test and Lint'

# Build + lint + unit tests for the Strands CLI (`@strands-agents/cli`). Reusable:
# called by ci.yml on PRs that touch strands-cli, and by release-harness-cli.yml
# at release time. Mirrors harness-ts-test-lint.yml.
#
# The CLI installs standalone against published Harness and SDK packages.
# Python runtime tests install the sibling packages, requiring a full checkout.

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  test-lint:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: strands-agents_ubuntu-latest_4-core, name: Test and Lint }
          - { os: strands-agents_windows-latest_4-core, name: Test and Lint (Windows) }
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: strands-cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Prepare Python agent runtime
        run: |
          python -m venv ../harness-py/.venv
          python -c "import os, pathlib, subprocess; root=pathlib.Path('../harness-py/.venv'); python=root/('Scripts/python.exe' if os.name == 'nt' else 'bin/python'); subprocess.check_call([str(python), '-m', 'pip', 'install', '--disable-pip-version-check', '-e', '../strands-py', '-e', '../harness-py'])"

      - name: Select test Python
        run: python -c "import os, pathlib; root=pathlib.Path('../harness-py/.venv').resolve(); python=root/('Scripts/python.exe' if os.name == 'nt' else 'bin/python'); env=open(os.environ['GITHUB_ENV'], 'a'); print(f'PYTHON={python}', file=env); print(f'STRANDS_TEST_PYTHON={python}', file=env)"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint, format, type-check, and test
        run: npm run check
