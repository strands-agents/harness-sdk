name: "Harness TypeScript: Test and Lint"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      local-strands-ts:
        description: 'Build, lint, and test against the checked-out strands-ts instead of the published @strands-agents/sdk.'
        required: false
        default: false
        type: boolean

jobs:
  test-lint:
    # `name` comes from the matrix so the Linux leg keeps its historical check name.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: strands-agents_ubuntu-latest_4-core, name: Test and Lint }
          - { os: strands-agents_windows-latest_4-core, name: Test and Lint (Windows) }
    # Build + check runs in ~2 min; 20 min caps a hung step instead of the 6-hour default.
    timeout-minutes: 20
    permissions:
      contents: read
    # harness-ts installs standalone against the published @strands-agents/sdk (pinned in its own
    # package-lock.json), NOT the sibling strands-ts source, so it is not a member of the repo-root
    # npm workspace. `local-strands-ts` swaps in a tarball packed from the sibling source.
    defaults:
      run:
        working-directory: harness-ts
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install local strands-ts
        if: inputs.local-strands-ts
        shell: bash
        # Packed rather than linked so the SDK's dependencies resolve inside harness-ts's own tree.
        # The stamped version only has to satisfy harness-ts's @strands-agents/sdk peer range.
        run: |
          set -euo pipefail
          (cd .. && npm ci --no-audit --no-fund)
          TARBALL=$(cd ../strands-ts && npm version 1.999.0 --no-git-tag-version >/dev/null && npm pack --silent --pack-destination "$RUNNER_TEMP")
          npm install --no-save --no-audit --no-fund "$RUNNER_TEMP/$TARBALL"
          node -e "const v = require('./node_modules/@strands-agents/sdk/package.json').version; if (v !== '1.999.0') throw new Error('expected local SDK, got ' + v); console.log('@strands-agents/sdk', v)"

      - name: Build
        run: npm run build

      - name: Lint, format, type-check, and test
        run: npm run check
