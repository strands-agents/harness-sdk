name: "Docs: Deploy to GitHub Pages"

on:
  workflow_dispatch:
    inputs:
      skip_changelog_check:
        description: 'Deploy even if a published release has no changelog entry yet'
        type: boolean
        default: false
      external_docs_snapshot:
        description: 'External docs source: latest tracked refs or the committed lock'
        type: choice
        options:
          - latest
          - locked
        default: latest

permissions:
  contents: write

defaults:
  run:
    working-directory: site

jobs:
  deploy:
    runs-on: strands-agents_ubuntu-latest_4-core

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout samples snapshot
        uses: actions/checkout@v7
        with:
          # Resolve main once; the checked-out commit stays immutable for the rest of the job.
          repository: strands-agents/samples
          ref: main
          path: samples-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      # Releases must ship with their changelog: merge the open
      # "docs(changelog): sync release notes" PR first (see CHANGELOG-SYNC.md).
      - name: Check every release has a changelog entry
        if: ${{ !inputs.skip_changelog_check }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          missing=0 unverified=0
          for repo in strands-agents/harness-sdk strands-agents/evals strands-agents/box; do
            code=0
            npm run -s changelog:sync -- --check --source-repo "$repo" || code=$?
            if [ "$code" = 1 ]; then missing=1; elif [ "$code" != 0 ]; then unverified=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::Merge the open changelog PR before deploying: https://github.com/strands-agents/harness-sdk/pulls?q=is%3Apr+is%3Aopen+head%3Achangelog%2Fsync"
          fi
          if [ "$unverified" = 1 ]; then
            echo "::error::Could not list releases from GitHub; re-run the deploy, or check skip_changelog_check if the API is down."
          fi
          [ "$missing" = 0 ] && [ "$unverified" = 0 ]

      - name: Resolve latest external documentation
        if: ${{ inputs.external_docs_snapshot != 'locked' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run external-docs:update-lock

      - name: Record documentation inputs snapshot
        id: content_snapshot
        run: |
          external_docs_snapshot="$(
            node -e '
              const { products } = require("./external-docs.lock.json")
              if (!Array.isArray(products) || products.length === 0) {
                throw new Error("External documentation lock has no products")
              }
              for (const { id, revision } of products) {
                if (typeof id !== "string" || !/^[0-9a-f]{40}$/.test(revision)) {
                  throw new Error(`${id ?? "unknown"}: lock revision is not a full lowercase commit SHA`)
                }
              }
              process.stdout.write(products.map(({ id, revision }) => `${id}@${revision}`).join(", "))
            '
          )"
          samples_revision="$(git -C "$GITHUB_WORKSPACE/samples-source" rev-parse HEAD)"
          if ! [[ "$samples_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The resolved samples revision is not a full lowercase commit SHA."
            exit 1
          fi
          echo "external_docs_snapshot=$external_docs_snapshot" >> "$GITHUB_OUTPUT"
          echo "samples_revision=$samples_revision" >> "$GITHUB_OUTPUT"
          printf 'External documentation snapshot: `%s`\n' "$external_docs_snapshot" >> "$GITHUB_STEP_SUMMARY"
          printf 'Samples snapshot: `%s`\n' "$samples_revision" >> "$GITHUB_STEP_SUMMARY"

      - name: Build CMS
        run: npm run cms:build
        env:
          SAMPLES_SOURCE_DIR: ${{ github.workspace }}/samples-source
          SAMPLES_REQUIRE_SOURCE: '1'
          SITE_DOMAIN: https://strandsagents.com

      - name: Create latest/ symlinks for llms.txt files
        run: |
          mkdir -p dist/latest
          ln dist/llms.txt dist/latest/llms.txt
          ln dist/llms-full.txt dist/latest/llms-full.txt

      - name: Deploy to gh-pages branch
        working-directory: .
        env:
          EXTERNAL_DOCS_SNAPSHOT: ${{ steps.content_snapshot.outputs.external_docs_snapshot }}
          SAMPLES_REVISION: ${{ steps.content_snapshot.outputs.samples_revision }}
          SITE_REVISION: ${{ github.sha }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin gh-pages || true
          git worktree add gh-pages-deploy origin/gh-pages 2>/dev/null || git worktree add --orphan -b gh-pages gh-pages-deploy
          rsync -a --delete --exclude='.git' --exclude='CNAME' site/dist/ gh-pages-deploy/
          cd gh-pages-deploy
          git add -A
          git diff --cached --quiet || git commit -m "Deploy to GitHub Pages from $SITE_REVISION (external docs $EXTERNAL_DOCS_SNAPSHOT, samples $SAMPLES_REVISION)"
          git push origin HEAD:gh-pages
