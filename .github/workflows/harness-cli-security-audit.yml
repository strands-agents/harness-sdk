name: "Harness CLI: Security Audit"

# Informational npm audit of the Strands CLI (`@strands-agents/cli`) dependency
# tree. Reusable; called by release-harness-cli.yml. Does not block the release:
# PR-introduced vulns are gated by the repo-level Dependency Review job in ci.yml,
# and pre-existing advisories are driven down via Dependabot.

on:
  workflow_call:
    inputs:
      sdk_version:
        description: Exact published SDK version containing the Mantle bearer-token fix
        required: false
        type: string
        default: ''
      harness_version:
        description: Exact published harness version to test and package for a CLI release
        required: false
        type: string
        default: ''
      release-sha:
        description: Full release commit SHA from origin/main history
        required: true
        type: string

jobs:
  security-audit:
    name: npm audit
    permissions:
      contents: read
    runs-on: strands-agents_ubuntu-latest_4-core
    defaults:
      run:
        working-directory: strands-cli
    steps:
      - name: Checkout event revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select trusted release commit
        shell: bash
        working-directory: .
        env:
          RELEASE_SHA: ${{ inputs.release-sha }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo "::error::release-sha must be a full commit SHA from origin/main history."
            exit 1
          fi
          git checkout --detach "$RELEASE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Select released SDK and harness
        if: inputs.harness_version != '' || inputs.sdk_version != ''
        shell: bash
        env:
          HARNESS_VERSION: ${{ inputs.harness_version }}
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          if ! [[ "$HARNESS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             ! [[ "$SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::harness_version and sdk_version must be exact published release versions."
            exit 1
          fi
          npm install --save-exact --ignore-scripts --no-audit --no-fund "@strands-agents/harness@$HARNESS_VERSION" "@strands-agents/sdk@$SDK_VERSION"

      - name: Audit dependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
