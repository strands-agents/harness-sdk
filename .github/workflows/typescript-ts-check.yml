name: "TypeScript: Code Quality"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  code-quality:
    name: Code Quality
    permissions:
      contents: read
    runs-on: strands-agents_ubuntu-latest_4-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run linting
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run type checking
        run: npm run type-check

      - name: Verify browser bundle
        run: npm run check:browser-bundle
