name: "TypeScript: Code Quality"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  code-quality:
    name: Code Quality
    permissions:
      contents: read
    runs-on: strands-agents_ubuntu-latest_4-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run linting
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run type checking
        run: npm run type-check

      - name: Verify browser bundle
        run: npm run check:browser-bundle

      # The peer range starts at 0.109.1; the lockfile holds the latest 1.x. Last, since it swaps node_modules.
      - name: Type-check and test against the lowest supported @anthropic-ai/sdk
        run: |
          npm install --no-save --ignore-scripts @anthropic-ai/sdk@0.109.1 -w strands-ts
          npm run type-check
          npm run test -w strands-ts -- src/models/__tests__/anthropic.test.ts
