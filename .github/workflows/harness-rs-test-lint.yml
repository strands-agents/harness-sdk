name: "Harness Rust: Test and Lint"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # clippy is pinned so lints added in a new stable release don't fail unrelated PRs.
  # Bump deliberately, together with the lint commands in CONTRIBUTING.md, README.md and strands-rs/AGENTS.md.
  RUST_LINT_TOOLCHAIN: '1.100.0'

jobs:
  test-lint:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: strands-agents_ubuntu-latest_4-core, name: Test and Lint }
          - { os: strands-agents_windows-latest_4-core, name: Test and Lint (Windows) }
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup toolchain install "$RUST_LINT_TOOLCHAIN" --profile minimal --component clippy

      - name: Clippy
        run: cargo +${{ env.RUST_LINT_TOOLCHAIN }} clippy -p strands-harness --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test -p strands-harness --all-features

      - name: Docs
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p strands-harness --all-features --no-deps
