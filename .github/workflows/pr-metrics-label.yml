name: PR Metrics (Label)

# Applies the size/* and complexity/* labels computed by pr-metrics-analyze.yml.
#
# SECURITY: this workflow holds `pull-requests: write`, so it must never execute
# or even check out PR code. It only reads a JSON artifact. Two defenses matter:
#
#   1. Label names are derived here from clamped integers in the artifact, never
#      taken as strings from it, so a malicious artifact cannot inject an
#      arbitrary label (`approved`, for example).
#   2. The PR number in the artifact is verified against the triggering run's
#      head SHA before use, so one PR cannot relabel another.
#
# It also only ever touches labels in its own managed namespace, so it cannot
# disturb labels applied by maintainers or other automation.

on:
  workflow_run:
    workflows: ['PR Metrics (Analyze)']
    types: [completed]

# Serialized per PR so two runs cannot interleave their remove/add calls and
# leave a PR with two size labels. Not cancel-in-progress: a cancelled run could
# stop between removing the stale label and adding the new one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  label:
    name: Label
    # A failed analysis has nothing trustworthy to label with.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: strands-agents_ubuntu-latest_4-core
    timeout-minutes: 5
    permissions:
      pull-requests: write
      actions: read
    steps:
      # Runs from the default branch, never the PR's revision.
      - name: Checkout labeling scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts/pr-metrics
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Absent when the PR's base revision predated the tooling and analysis was
      # skipped, so a missing artifact leaves labels untouched rather than failing.
      - name: Download metrics
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-metrics
          path: metrics
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply labels
        if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { applyLabels } = await import('${{ github.workspace }}/.github/scripts/pr-metrics/apply-labels.mjs')
            await applyLabels({ github, context, core, workspace: process.env.GITHUB_WORKSPACE })
