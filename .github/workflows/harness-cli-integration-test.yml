name: "Harness CLI: Integration Test"

# Live-model integration tests for the Strands CLI (`@strands-agents/cli`),
# against Bedrock via OIDC. Same security model as the SDK's
# typescript-integration-test.yml: pull_request_target runs in the base-repo
# context, so an authorization-check routes untrusted PRs to a manual-approval
# environment before any credentialed job runs, and the test job checks out the
# PR head.
#
# Reusable too: release-harness-cli.yml calls it with an explicit `ref`; the
# authorization-check is skipped on that path because the caller is
# workflow_dispatch-gated (repo write access).

on:
  pull_request_target:
    branches: [main]
    paths:
      - 'strands-cli/**'
      - '.github/workflows/harness-cli-*'
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

concurrency:
  group: harness-cli-integration-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.ref == '' && github.event_name == 'pull_request_target' }}

jobs:
  validate-call-ref:
    name: Validate workflow_call ref
    if: inputs.ref != ''
    runs-on: strands-agents_ubuntu-latest_4-core
    permissions:
      contents: read
    steps:
      - name: Reject untrusted-shaped refs
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/pull/*|*:*)
              echo "::error::workflow_call ref '$REF' looks like a fork PR or cross-repo ref."
              exit 1
              ;;
          esac
          echo "ref '$REF' passed shape check."

  authorization-check:
    name: Check access
    needs: [validate-call-ref]
    if: |
      always() &&
      (needs.validate-call-ref.result == 'success' || needs.validate-call-ref.result == 'skipped')
    permissions:
      contents: read
    runs-on: strands-agents_ubuntu-latest_4-core
    outputs:
      approval-env: ${{ steps.auth.outputs.approval-env }}
    steps:
      - name: Check Authorization
        id: auth
        uses: strands-agents/devtools/authorization-check@main
        with:
          skip-check: ${{ github.event_name == 'merge_group' || inputs.ref != '' }}
          username: ${{ github.event.pull_request.user.login || 'invalid' }}
          allowed-roles: 'maintain,triage,write,admin'

  integration-test:
    name: Run integration tests
    runs-on: strands-agents_ubuntu-latest_4-core
    needs: authorization-check
    if: always() && needs.authorization-check.result == 'success'
    environment:
      name: ${{ needs.authorization-check.outputs.approval-env }}
      deployment: false
    permissions:
      id-token: write
      pull-requests: read
      contents: read
    defaults:
      run:
        working-directory: strands-cli
    steps:
      - name: Configure Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.STRANDS_INTEG_TEST_ROLE }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Checkout head commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true  # opt back into fork-PR checkout, blocked by default in checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        # The CLI e2e drives the built `strands` binary.
        run: npm run build

      - name: Run integration tests
        env:
          AWS_REGION: us-east-1
        run: npm run test:integ
