name: "Harness CLI: Integration Test"

# Live-model integration tests for the Strands CLI (`@strands-agents/cli`),
# against Bedrock via OIDC. Same security model as the SDK's
# typescript-integration-test.yml: pull_request_target runs in the base-repo
# context, so an authorization-check routes untrusted PRs to a manual-approval
# environment before any credentialed job runs, and the test job checks out the
# PR head.
#
# Releases provide a full `release-sha`, verified against origin/main history
# before repository code runs or AWS credentials are configured.

on:
  pull_request_target:
    branches: [main]
    paths:
      - 'strands-cli/**'
      - '.github/workflows/harness-cli-*'
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      sdk_version:
        description: Exact published SDK version containing the Mantle bearer-token fix
        required: false
        type: string
        default: ''
      harness_version:
        description: Exact published harness version to test and package for a CLI release
        required: false
        type: string
        default: ''
      release-sha:
        description: Full release commit SHA from origin/main history
        required: true
        type: string

concurrency:
  group: harness-cli-integration-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.release-sha == '' && github.event_name == 'pull_request_target' }}

jobs:
  authorization-check:
    name: Check access
    permissions:
      contents: read
    runs-on: strands-agents_ubuntu-latest_4-core
    outputs:
      approval-env: ${{ steps.auth.outputs.result }}
    steps:
      - name: Check Authorization
        id: auth
        uses: actions/github-script@v8
        env:
          SKIP_CHECK: ${{ github.event_name == 'merge_group' || inputs.release-sha != '' }}
        with:
          result-encoding: string
          script: |
            if (process.env.SKIP_CHECK === 'true') return 'auto-approve';
            const pr = context.payload.pull_request;
            if (!pr || pr.draft) return 'manual-approval';
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: pr.user.login,
            });
            return ['maintain', 'triage', 'write', 'admin'].includes(data.role_name)
              ? 'auto-approve'
              : 'manual-approval';

  integration-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: strands-agents_ubuntu-latest_4-core, name: Run integration tests }
          - { os: strands-agents_windows-latest_4-core, name: Run integration tests (Windows) }
    needs: authorization-check
    if: always() && needs.authorization-check.result == 'success'
    environment:
      name: ${{ needs.authorization-check.outputs.approval-env }}
      deployment: false
    permissions:
      id-token: write
      pull-requests: read
      contents: read
    defaults:
      run:
        working-directory: strands-cli
    steps:
      - name: Checkout head commit
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true  # opt back into fork-PR checkout, blocked by default in checkout@v7

      - name: Checkout event revision
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select trusted release commit
        if: inputs.release-sha != ''
        shell: bash
        working-directory: .
        env:
          RELEASE_SHA: ${{ inputs.release-sha }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo "::error::release-sha must be a full commit SHA from origin/main history."
            exit 1
          fi
          git checkout --detach "$RELEASE_SHA"

      - name: Configure Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.STRANDS_INTEG_TEST_ROLE }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install PortAudio
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: npm ci

      - name: Select released SDK and harness
        if: inputs.harness_version != '' || inputs.sdk_version != ''
        shell: bash
        env:
          HARNESS_VERSION: ${{ inputs.harness_version }}
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          if ! [[ "$HARNESS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             ! [[ "$SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::harness_version and sdk_version must be exact published release versions."
            exit 1
          fi
          npm install --save-exact --ignore-scripts --no-audit --no-fund "@strands-agents/harness@$HARNESS_VERSION" "@strands-agents/sdk@$SDK_VERSION"

      - name: Build
        # The CLI e2e drives the built `strands` binary.
        run: npm run build

      - name: Prepare and test voice runtime
        run: npm run test:voice

      - name: Run integration tests
        env:
          AWS_REGION: us-east-1
        run: npm run test:integ
