name: "Docs: CI"

on:
  workflow_dispatch:
    inputs:
      samples_ref:
        description: 'Samples branch, tag, or commit to test (defaults to samples/main)'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      samples_ref:
        description: 'Samples branch, tag, or commit to test'
        type: string
        required: false
        default: 'main'

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  ci:
    name: CI
    runs-on: strands-agents_ubuntu-latest_4-core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout samples
        uses: actions/checkout@v7
        with:
          repository: strands-agents/samples
          ref: ${{ inputs.samples_ref || 'main' }}
          path: samples-source
          persist-credentials: false

      - name: Record samples revision
        working-directory: samples-source
        run: |
          samples_sha=$(git rev-parse HEAD)
          echo "### Samples source" >> "$GITHUB_STEP_SUMMARY"
          echo "\`strands-agents/samples@$samples_sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run cms:build
        # The full docs build (~890 pages + generated API reference) peaks above
        # Node's default heap on the runner; raise the ceiling to avoid an OOM.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          SAMPLES_SOURCE_DIR: ${{ github.workspace }}/samples-source
          SAMPLES_REQUIRE_SOURCE: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Build TypeScript SDK
        run: npm install --ignore-scripts && npm run build && rm -rf node_modules
        working-directory: strands-ts

      - name: Re-link SDK types
        run: npm install

      - name: Typecheck snippets
        run: npm run typecheck:snippets

      - name: Test
        run: npm test
