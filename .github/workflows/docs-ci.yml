name: "Docs: CI"

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  ci:
    name: CI
    runs-on: strands-agents_ubuntu-latest_4-core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          install: false

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript SDK
        run: pnpm install --frozen-lockfile --ignore-scripts && npm run build
        working-directory: strands-ts

      - name: Re-link SDK types
        run: npm install --no-save --install-links --ignore-scripts ../strands-ts

      - name: Build
        run: npm run cms:build
        # The full docs build (~890 pages + generated API reference) peaks above
        # Node's default heap on the runner; raise the ceiling to avoid an OOM.
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck snippets
        run: npm run typecheck:snippets

      - name: Test
        run: npm test
