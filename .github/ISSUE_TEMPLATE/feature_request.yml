name: Feature Request
description: Suggest a new feature or enhancement for Strands Agents SDK
title: "[FEATURE] "
labels: ["triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature for Strands Agents SDK!
  - type: textarea
    id: human-overview
    attributes:
      label: Human Overview
      description: |
        If an AI agent drafted this request, a human must give a short overview here in their own words. An AI agent MUST NOT fill out this section. See team/AI_USAGE_POLICY.md. (50 words)
      placeholder: In my own words, I want...
  - type: dropdown
    id: sdk-language
    attributes:
      label: SDK Language
      description: Which Strands SDK is this feature for?
      options:
        - Python
        - TypeScript
        - Both / Not language-specific
    validations:
      required: true
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: Describe the problem you're trying to solve. What is currently difficult or impossible to do? (100 words)
      placeholder: I would like Strands to...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Optional - Describe your proposed solution. How would this feature work? (150 words)
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Provide specific use cases for the feature. How would people use it? (100 words)
      placeholder: This would help with...
    validations:
      required: true
  - type: textarea
    id: alternatives-solutions
    attributes:
      label: Alternatives Solutions
      description: Optional - Have you considered alternative approaches? What are their pros and cons? (100 words)
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: |
        Optional. Extended context that doesn't fit above: screenshots, code examples, references, or supplementary background.
        Wrap it in a <details> block so the issue stays scannable by default.
      placeholder: |
        <details>
        <summary>Extended context (optional)</summary>

        <!-- Extended content here -->

        </details>
