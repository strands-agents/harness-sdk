# .github/labelers/language.yml
# Identifies which SDK language the issue relates to.
# Use max_labels: 1 since most issues target one language.

instructions: |
  This is a monorepo with Python and TypeScript SDKs, Python and TypeScript harness packages, a TypeScript CLI, and a Python MCP server.
  Look for language-specific keywords: Python paths (strands-py/, harness-py/, strands-mcp/, .py files, pip, pyproject.toml, strands-agents, strands-harness),
  TypeScript paths (strands-ts/, harness-ts/, strands-cli/, .ts files, npm, package.json, @strands-agents/sdk, @strands-agents/harness, @strands-agents/cli).
  Issues about the strands CLI are typescript.
  For [PORT] issues, label the target SDK language (the one the work is being ported into), not the source.
  If the issue clearly targets both languages equally, prefer the language where the bug or feature originates.
  If the issue is language-agnostic or unclear, do not assign a label.
  Issues about general agent behavior, documentation content, or feature requests without language-specific file paths or package managers should not receive a language label.

# On issue events, each label also sets the native "Language" issue field via `option:`.
field:
  name: Language

labels:
  python:
    description: "Issue relates to the Python SDK, Python harness, or strands-mcp (strands-py/, harness-py/, strands-mcp/, .py files, pip, pyproject.toml)"
    option: Python
  typescript:
    description: "Issue relates to the TypeScript SDK, TypeScript harness, or strands CLI (strands-ts/, harness-ts/, strands-cli/, .ts files, npm, package.json)"
    option: TypeScript
