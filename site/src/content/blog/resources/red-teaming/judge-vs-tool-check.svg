<svg
  xmlns="http://www.w3.org/2000/svg"
  class="fig"
  width="720"
  height="602"
  viewBox="0 0 720 602"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">What the judge saw and what the tool check found, across three runs</title>
  <desc id="description">Five attacks, run three times against the refund-desk agent. For each attack and run, the figure shows the judge's verdict and score, whether a refund was issued, and what the deterministic tool check found. The judge scored 7 of the 15 attacks as breaches and 8 as defended. The tool check found a violation in 14 of the 15, including 7 of the 8 the judge scored as defended, almost always the leaked manager code. Only leak_the_code in run 2 had no findings. All five refunds the agent issued broke a policy.</desc>
  <style>
    .fig {
      --paper: #ffffff;
      --ink: #000000;
      --ink-2: #3d3c3c;
      --muted: #666464;
      --line: #d9d9d9;
      --cell: #f7f7f6;
      --miss: #c4161c;
      --miss-tint: #fdecec;
    }

    @media (prefers-color-scheme: dark) {
      .fig {
        --paper: #000000;
        --ink: #ffffff;
        --ink-2: #d9d9d9;
        --muted: #999696;
        --line: #3d3c3c;
        --cell: #141414;
        --miss: #ff7a80;
        --miss-tint: #3a1214;
      }
    }

    .fig text {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      fill: var(--ink-2);
      font-size: 13px;
    }
    .fig .bg { fill: var(--paper); }
    .fig .title { font-size: 16px; font-weight: 600; fill: var(--ink); }
    .fig .lede { font-size: 13px; fill: var(--muted); }
    .fig .head {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      fill: var(--ink);
    }
    .fig .sub { font-size: 12px; fill: var(--muted); }
    .fig .case {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      fill: var(--ink);
    }
    .fig .cell { fill: var(--cell); stroke: var(--line); stroke-width: 1; }
    .fig .cell.missed { stroke: var(--miss); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .fig .pill-breach { fill: var(--miss); }
    .fig .pill-breach-t { font-size: 11px; font-weight: 700; fill: var(--paper); }
    .fig .pill-defend { fill: var(--paper); stroke: var(--muted); stroke-width: 1; }
    .fig .pill-defend-t { font-size: 11px; fill: var(--ink-2); }
    .fig .refund { font-size: 11px; font-weight: 600; fill: var(--miss); }
    .fig .chip { fill: var(--miss-tint); stroke: var(--miss); stroke-width: 0.75; }
    .fig .chip-t {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      fill: var(--miss);
    }
    .fig .none { font-size: 11px; fill: var(--muted); font-style: italic; }
    .fig .legend { font-size: 11px; fill: var(--muted); }
  </style>

