<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" style="background:#0d1117; border-radius:10px;">
  <defs>
    <marker id="ah-blue" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="ah-purple" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a371f7"/>
    </marker>
    <marker id="ah-green" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/>
    </marker>
    <marker id="ah-gray" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6e7681"/>
    </marker>
  </defs>

  <!-- ===================== Agent Pool container ===================== -->
  <rect x="300" y="70" width="360" height="300" rx="12" fill="#11151c" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="320" y="98" font-size="12" fill="#8b949e" font-weight="600" letter-spacing="0.8">STRANDS AGENT POOL</text>

  <!-- ===================== Inputs (left) ===================== -->
  <!-- User / UX -->
  <rect x="30" y="150" width="110" height="52" rx="9" fill="#161b22" stroke="#484f58" stroke-width="1.25"/>
  <text x="85" y="181" text-anchor="middle" font-size="13" fill="#e6edf3" font-weight="600">User / UX</text>

  <!-- Figma -->
  <rect x="30" y="300" width="110" height="52" rx="9" fill="#1a1226" stroke="#a371f7" stroke-width="1.5"/>
  <text x="85" y="331" text-anchor="middle" font-size="13" fill="#c8a6ff" font-weight="600">Figma</text>

  <!-- ===================== Gateways (mid-left) ===================== -->
  <!-- Agent Orchestrator -->
  <rect x="180" y="146" width="118" height="60" rx="9" fill="#0d2540" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="239" y="171" text-anchor="middle" font-size="12.5" fill="#79c0ff" font-weight="600">Agent</text>
  <text x="239" y="188" text-anchor="middle" font-size="12.5" fill="#79c0ff" font-weight="600">Orchestrator</text>

  <!-- Figma MCP -->
  <rect x="180" y="300" width="118" height="52" rx="9" fill="#1a1226" stroke="#a371f7" stroke-width="1.25"/>
  <text x="239" y="323" text-anchor="middle" font-size="12" fill="#c8a6ff">Figma</text>
  <text x="239" y="339" text-anchor="middle" font-size="12" fill="#c8a6ff">MCP</text>

  <!-- ===================== Agents (grid inside pool) ===================== -->
  <!-- Row 1 -->
  <rect x="326" y="118" width="146" height="52" rx="8" fill="#0d2540" stroke="#58a6ff" stroke-width="1.25"/>
  <text x="399" y="140" text-anchor="middle" font-size="12" fill="#79c0ff" font-weight="600">Code</text>
  <text x="399" y="156" text-anchor="middle" font-size="12" fill="#79c0ff" font-weight="600">Generation</text>

  <rect x="488" y="118" width="146" height="52" rx="8" fill="#0d2540" stroke="#58a6ff" stroke-width="1.25"/>
  <text x="561" y="140" text-anchor="middle" font-size="12" fill="#79c0ff" font-weight="600">Planning</text>
  <text x="561" y="156" text-anchor="middle" font-size="12" fill="#79c0ff" font-weight="600">&amp; Research</text>

  <!-- Row 2 -->
  <rect x="326" y="186" width="146" height="52" rx="8" fill="#0d2540" stroke="#58a6ff" stroke-width="1.25"/>
  <text x="399" y="208" text-anchor="middle" font-size="12" fill="#79c0ff" font-weight="600">QA</text>
  <text x="399" y="224" text-anchor="middle" font-size="12" fill="#79c0ff" font-weight="600">Testing</text>

  <rect x="488" y="186" width="146" height="52" rx="8" fill="#0d2540" stroke="#58a6ff" stroke-width="1.25"/>
  <text x="561" y="208" text-anchor="middle" font-size="12" fill="#79c0ff" font-weight="600">Measurement</text>
  <text x="561" y="224" text-anchor="middle" font-size="12" fill="#79c0ff" font-weight="600">&amp; Metrics</text>

  <!-- Row 3 -->
  <rect x="326" y="254" width="146" height="52" rx="8" fill="#0d2540" stroke="#58a6ff" stroke-width="1.25"/>
  <text x="399" y="276" text-anchor="middle" font-size="12" fill="#79c0ff" font-weight="600">Design</text>
  <text x="399" y="292" text-anchor="middle" font-size="12" fill="#79c0ff" font-weight="600">Extractor</text>

  <rect x="488" y="254" width="146" height="52" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1.25"/>
  <text x="561" y="274" text-anchor="middle" font-size="11.5" fill="#8b949e" font-weight="600">Title Agent</text>
  <text x="561" y="291" text-anchor="middle" font-size="9.5" fill="#6e7681">Haiku · parallel</text>

  <!-- ===================== Outputs (right) ===================== -->
  <rect x="742" y="140" width="118" height="56" rx="9" fill="#0c2b18" stroke="#3fb950" stroke-width="1.5"/>
  <text x="801" y="164" text-anchor="middle" font-size="12.5" fill="#56d364" font-weight="600">Layout</text>
  <text x="801" y="181" text-anchor="middle" font-size="12.5" fill="#56d364" font-weight="600">Code</text>

  <rect x="742" y="244" width="118" height="56" rx="9" fill="#0c2b18" stroke="#3fb950" stroke-width="1.25"/>
  <text x="801" y="268" text-anchor="middle" font-size="12.5" fill="#56d364" font-weight="600">Adaptive</text>
  <text x="801" y="285" text-anchor="middle" font-size="12.5" fill="#56d364" font-weight="600">Renderer</text>

  <!-- ===================== Data store (bottom) ===================== -->
  <rect x="330" y="404" width="300" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="480" y="428" text-anchor="middle" font-size="12" fill="#adbac7" font-weight="600">Bedrock Knowledge Base · S3 · DynamoDB</text>
  <text x="480" y="446" text-anchor="middle" font-size="10" fill="#6e7681">UX guidelines · component rules · layout metadata</text>

  <!-- ===================== Arrows ===================== -->
  <!-- User -> Orchestrator -->
  <line x1="140" y1="176" x2="176" y2="176" stroke="#58a6ff" stroke-width="1.75" marker-end="url(#ah-blue)"/>
  <!-- Orchestrator -> Agent Pool -->
  <line x1="298" y1="176" x2="322" y2="176" stroke="#58a6ff" stroke-width="1.75" marker-end="url(#ah-blue)"/>
  <!-- Figma -> Figma MCP -->
  <line x1="140" y1="326" x2="176" y2="326" stroke="#a371f7" stroke-width="1.75" marker-end="url(#ah-purple)"/>
  <!-- Figma MCP -> Design Extractor -->
  <line x1="298" y1="316" x2="322" y2="292" stroke="#a371f7" stroke-width="1.5" marker-end="url(#ah-purple)"/>
  <!-- Code Generation -> Layout Code (clean arc over the pool) -->
  <path d="M462 118 C 560 58, 690 62, 740 150" fill="none" stroke="#3fb950" stroke-width="1.75" marker-end="url(#ah-green)"/>
  <!-- Agent Pool -> Adaptive Renderer -->
  <line x1="634" y1="230" x2="738" y2="262" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ah-green)"/>
  <!-- Agent Pool -> Data store -->
  <line x1="480" y1="370" x2="480" y2="401" stroke="#6e7681" stroke-width="1.25" stroke-dasharray="4,3" marker-end="url(#ah-gray)"/>

  <!-- ===================== Model legend ===================== -->
  <g font-size="10.5" fill="#8b949e">
    <circle cx="312" cy="35" r="4" fill="#58a6ff"/>
    <text x="322" y="39">Opus 4 · code gen</text>
    <circle cx="447" cy="35" r="4" fill="#79c0ff"/>
    <text x="457" y="39">Sonnet 4 · orchestration</text>
    <circle cx="612" cy="35" r="4" fill="#6e7681"/>
    <text x="622" y="39">Haiku 3 · title</text>
  </g>
</svg>
