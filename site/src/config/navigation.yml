# Navigation configuration for Strands Agents SDK documentation
# This file combines navbar, sidebar, and GitHub dropdown configuration.
#
# STRUCTURE:
# - navbar: Top navigation bar links
# - sidebar: Hierarchical sidebar structure (slugs only for files - labels from frontmatter)
# - github: GitHub dropdown sections
#
# NOTE: Page (leaf) badges come from page frontmatter, not this file. Group labels
# have no frontmatter, so a group may declare a `badge` here (text + variant) to
# surface status on a collapsed section. Never hand-write a New badge: set
# `addedDate` on the group (pages set it in frontmatter) and the badge derives
# from it for 30 days.
#
# IA: the docs are organized around products (Strands harness, SDK, Shell,
# Evals SDK). Each product's basePath(s) scope the left sidebar (via
# route-middleware) to just that product's pages, and every product's sidebar
# follows the same shape: Get started -> Build guides -> Run guides ->
# Components -> Reference. First-level bands always render open; depth>=1 subgroups
# collapse by default (see route-middleware.ts applyCollapse). Do not set
# `collapsed:` on a first-level band.

navbar:
  - label: Home
    href: /
  # Per-product docs sections. Each product's basePath(s) scope the left sidebar.
  # Longest-prefix wins, so a product's specific paths never collide.
  - label: Harness
    href: /docs/user-guide/harness/
    basePath:
      - /docs/user-guide/harness/
  # SDK is the largest product space: the Strands Harness SDK concepts, the build-time
  # and run-time guides (deploy, observability, safety), and the generated
  # reference all live under /docs/user-guide/sdk/.
  - label: Harness SDK
    href: /docs/user-guide/sdk/
    basePath:
      - /docs/user-guide/sdk/
      # The "choosing a foundation" decision and the migration guides live with
      # the Strands Harness SDK — they compare and migrate onto the Strands Harness SDK.
      - /docs/user-guide/migrate/
      # The generated API reference is the Strands Harness SDK's own reference layer, so
      # /docs/api/ is scoped into this product (surfaces the Reference band links).
      - /docs/api/
  - label: Shell
    href: /docs/user-guide/shell/
    basePath:
      - /docs/user-guide/shell/
  - label: Evals
    href: /docs/user-guide/evals-sdk/
    basePath:
      - /docs/user-guide/evals-sdk/
  # Fallback: any /docs/user-guide/ page not matched by a product above still
  # resolves here (shortest match, so it never overrides a product) rather than
  # getting an empty sidebar.
  - label: Docs
    href: /docs/user-guide/sdk/
    basePath: /docs/user-guide/
  # Examples is the standalone /examples/ catalog (pulled from the samples
  # repo), not a docs section — so it carries no basePath.
  - label: Examples
    href: /examples/
  # Learn is the courses / learning path. Integrations is the catalog plus the
  # labs docs. Contribute is its own top-level section.
  - label: Learn
    href: /docs/learning/how-agents-really-work/
    basePath:
      - /docs/learning/
  - label: Integrations
    href: /integrations/
    basePath:
      - /integrations/
      - /docs/integrations/
      - /docs/labs/
  - label: Contribute
    href: /docs/contribute/
    basePath:
      - /docs/contribute/
  - label: API Reference
    href: /docs/api/typescript/
    basePath: /docs/api/
  - label: Blog
    href: /blog/
    basePath: /blog/
    align: right
  - label: Changelog
    href: /changelog/
    basePath: /changelog/
    align: right
  - label: Labs
    href: https://github.com/strands-labs
    external: true
    align: right

# Products — the single source of truth for the "Products" dropdown, in display
# order. The docs nav is organized around products so the dropdown and the docs
# stay aligned. Add a product here to surface it in the dropdown; the `href` is
# its landing/hub page and `pages` are the key links shown on mobile.
