<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 192" width="720" height="192">
  <!-- Type: pipeline (before half of a pair; node x positions match migrate-langgraph-agent-nodes). Story: in LangGraph each node is a function you write that runs once and hands control back to the graph. -->
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- Zones -->
  <rect class="dg-zone" x="16" y="16" width="688" height="160" rx="8"/>
  <text class="dg-eyebrow" x="32" y="36">LANGGRAPH · EACH NODE IS A FUNCTION</text>
  <!-- Where the agent version draws each node's loop -->
  <text class="dg-note" x="360" y="76" text-anchor="middle">No loop inside a node: each one does one thing and returns an update</text>
  <g transform="translate(0,40)">

    <!-- Edges -->
    <path class="dg-edge" d="M208,88 H278" marker-end="url(#arrow)"/>
    <path class="dg-edge" d="M440,88 H510" marker-end="url(#arrow)"/>

    <!-- Nodes -->
    <rect class="dg-node" x="48" y="56" width="160" height="64" rx="6"/>
    <text class="dg-name" x="128" y="85" text-anchor="middle">Research</text>
    <text class="dg-code" x="128" y="103" text-anchor="middle">research(state)</text>

    <rect class="dg-node" x="280" y="56" width="160" height="64" rx="6"/>
    <text class="dg-name" x="360" y="85" text-anchor="middle">Analysis</text>
    <text class="dg-code" x="360" y="103" text-anchor="middle">analysis(state)</text>

    <rect class="dg-node" x="512" y="56" width="160" height="64" rx="6"/>
    <text class="dg-name" x="592" y="85" text-anchor="middle">Review</text>
    <text class="dg-code" x="592" y="103" text-anchor="middle">review(state)</text>
  </g>
</svg>
