<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <!-- Type: sequence with phase bands. Story: a background tool call returns a receipt at once; the real result reaches the model later, on its own. -->
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head is-accent" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- Phase bands -->
  <rect class="dg-zone" x="8" y="80" width="704" height="148" rx="8"/>
  <rect class="dg-zone" x="8" y="236" width="704" height="96" rx="8"/>
  <rect class="dg-zone" x="8" y="340" width="704" height="108" rx="8"/>

  <!-- Lifelines -->
  <line class="dg-lifeline" x1="104" y1="64" x2="104" y2="452"/>
  <line class="dg-lifeline" x1="360" y1="64" x2="360" y2="452"/>
  <line class="dg-lifeline" x1="616" y1="64" x2="616" y2="452"/>

  <!-- Phase labels (masked over the first lifeline) -->
  <rect class="dg-mask is-on-zone" x="20" y="88" width="104" height="14" rx="2"/>
  <text class="dg-eyebrow" x="24" y="99">1 · DISPATCH</text>
  <rect class="dg-mask is-on-zone" x="20" y="244" width="104" height="14" rx="2"/>
  <text class="dg-eyebrow" x="24" y="255">2 · CONTINUE</text>
  <rect class="dg-mask is-on-zone" x="20" y="348" width="104" height="14" rx="2"/>
  <text class="dg-eyebrow" x="24" y="359">3 · DELIVERY</text>

  <!-- Messages: time flows down, every arrow is horizontal -->
  <path class="dg-edge" d="M104,132 H358" marker-end="url(#arrow)"/>
  <text class="dg-msg" x="232" y="121" text-anchor="middle">requests a tool call</text>

  <path class="dg-edge is-accent" d="M360,168 H614" marker-end="url(#arrow-accent)"/>
  <text class="dg-msg is-accent" x="488" y="157" text-anchor="middle">queues the tool</text>

  <path class="dg-edge is-dashed" d="M360,204 H106" marker-end="url(#arrow)"/>
  <text class="dg-msg" x="232" y="193" text-anchor="middle">receipt with task ID</text>

  <path class="dg-edge" d="M360,288 H106" marker-end="url(#arrow)"/>
  <text class="dg-msg" x="232" y="277" text-anchor="middle">next model call</text>

  <path class="dg-edge" d="M616,288 H592 Q584,288 584,296 V300 Q584,308 592,308 H614" marker-end="url(#arrow)"/>
  <text class="dg-msg" x="572" y="302" text-anchor="end">tool runs</text>

  <path class="dg-edge is-dashed" d="M616,392 H362" marker-end="url(#arrow)"/>
  <text class="dg-msg" x="488" y="381" text-anchor="middle">result ready</text>

  <path class="dg-edge is-accent" d="M360,428 H106" marker-end="url(#arrow-accent)"/>
  <text class="dg-msg is-accent" x="232" y="417" text-anchor="middle">delivers the result</text>

  <!-- Actors -->
  <rect class="dg-node is-input" x="40" y="16" width="128" height="48" rx="6"/>
  <text class="dg-name" x="104" y="45" text-anchor="middle">Model</text>

  <rect class="dg-node" x="296" y="16" width="128" height="48" rx="6"/>
  <text class="dg-name" x="360" y="45" text-anchor="middle">Agent</text>

  <rect class="dg-node" x="536" y="16" width="160" height="48" rx="6"/>
  <text class="dg-name" x="616" y="45" text-anchor="middle">Background task</text>
</svg>
