<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="720" height="296">
  <!-- Type: loop (two-station) with exit. Story: your schema becomes a tool; the model calls it until the arguments validate, and the validated object lands on the result. -->
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head is-accent" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- Zones -->
  <rect class="dg-zone" x="208" y="24" width="496" height="144" rx="8"/>
  <text class="dg-eyebrow" x="224" y="44">AGENT LOOP</text>

  <!-- Edges (drawn before nodes) -->
  <path class="dg-edge" d="M128,104 H238" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M360,88 H454" marker-end="url(#arrow)"/>
  <path class="dg-edge is-dashed" d="M456,120 H362" marker-end="url(#arrow)"/>
  <path class="dg-edge is-accent" d="M564,136 V214" marker-end="url(#arrow-accent)"/>

  <!-- Edge labels -->
  <rect class="dg-mask" x="136" y="84" width="64" height="12" rx="2"/>
  <text class="dg-label" x="168" y="93" text-anchor="middle">AS A TOOL</text>
  <text class="dg-label" x="408" y="77" text-anchor="middle">TOOL CALL</text>
  <text class="dg-label" x="408" y="109.5" text-anchor="middle">ERRORS</text>
  <rect class="dg-mask" x="572" y="183" width="40" height="12" rx="2"/>
  <text class="dg-label is-accent" x="576" y="192">VALID</text>

  <!-- Nodes -->
  <rect class="dg-node is-input" x="16" y="80" width="112" height="48" rx="6"/>
  <text class="dg-name" x="72" y="109" text-anchor="middle">Your schema</text>

  <rect class="dg-node" x="240" y="72" width="120" height="64" rx="6"/>
  <text class="dg-name" x="300" y="101" text-anchor="middle">Model</text>
  <text class="dg-sub" x="300" y="119" text-anchor="middle">calls the tool</text>

  <rect class="dg-node is-focal" x="456" y="72" width="216" height="64" rx="6"/>
  <text class="dg-name is-focal-text" x="564" y="101" text-anchor="middle">Structured output tool</text>
  <text class="dg-sub" x="564" y="119" text-anchor="middle">validates the arguments</text>

  <rect class="dg-node" x="476" y="216" width="176" height="64" rx="6"/>
  <text class="dg-name" x="564" y="245" text-anchor="middle">Validated object</text>
  <text class="dg-sub" x="564" y="263" text-anchor="middle">on the agent result</text>
</svg>
