<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" width="720" height="368">
  <!-- Type: architecture (after half of a pair; layout matches migrate-langgraph-shared-state). Story: in Strands each node passes its output along the edges, and a session manager on the graph persists its run state separately. -->
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head is-accent" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- Zones -->
  <rect class="dg-zone" x="16" y="16" width="688" height="240" rx="8"/>
  <text class="dg-eyebrow" x="32" y="36">STRANDS GRAPH · OUTPUT FLOWS ALONG EDGES</text>
  <text class="dg-note" x="360" y="212" text-anchor="middle">No shared state object</text>

  <!-- Edges: output hand-offs (the headline) -->
  <path class="dg-edge is-accent" d="M208,88 H278" marker-end="url(#arrow-accent)"/>
  <path class="dg-edge is-accent" d="M440,88 H510" marker-end="url(#arrow-accent)"/>
  <!-- Edge: persistence, attached to the graph -->
  <path class="dg-edge is-dashed" d="M360,256 V286" marker-end="url(#arrow)"/>

  <!-- Edge labels -->
  <rect class="dg-mask is-on-zone" x="218" y="68" width="52" height="12" rx="2"/>
  <text class="dg-label is-accent" x="244" y="77" text-anchor="middle">OUTPUT</text>
  <rect class="dg-mask is-on-zone" x="450" y="68" width="52" height="12" rx="2"/>
  <text class="dg-label is-accent" x="476" y="77" text-anchor="middle">OUTPUT</text>
  <rect class="dg-mask" x="366" y="266" width="60" height="12" rx="2"/>
  <text class="dg-label" x="370" y="275">PERSISTS</text>

  <!-- Nodes -->
  <rect class="dg-node" x="48" y="56" width="160" height="64" rx="6"/>
  <text class="dg-name" x="128" y="85" text-anchor="middle">Research</text>
  <text class="dg-sub" x="128" y="103" text-anchor="middle">own conversation</text>

  <rect class="dg-node" x="280" y="56" width="160" height="64" rx="6"/>
  <text class="dg-name" x="360" y="85" text-anchor="middle">Analysis</text>
  <text class="dg-sub" x="360" y="103" text-anchor="middle">own conversation</text>

  <rect class="dg-node" x="512" y="56" width="160" height="64" rx="6"/>
  <text class="dg-name" x="592" y="85" text-anchor="middle">Review</text>
  <text class="dg-sub" x="592" y="103" text-anchor="middle">own conversation</text>

  <rect class="dg-node" x="248" y="288" width="224" height="64" rx="6"/>
  <text class="dg-name" x="360" y="317" text-anchor="middle">Session manager</text>
  <text class="dg-sub" x="360" y="335" text-anchor="middle">on the graph, by case ID</text>
</svg>
