<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" width="720" height="584">
  <!-- Type: architecture (layered, top to bottom). Story: the agent acts only through Box's shell, egress gateway, and MCP broker; each asks one Dogwood policy engine, the gateway forwards permitted requests to allowed destinations, and tools and MCP servers each run in their own sandbox. -->
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- Zones -->
  <rect class="dg-zone is-boundary" x="224" y="16" width="272" height="104" rx="8"/>
  <text class="dg-eyebrow" x="240" y="36">AGENT'S SANDBOX</text>
  <rect class="dg-zone" x="16" y="208" width="688" height="232" rx="8"/>
  <text class="dg-eyebrow" x="32" y="228">BOX'S TRUSTED PROCESS</text>
  <rect class="dg-zone is-boundary" x="32" y="464" width="192" height="104" rx="8"/>
  <text class="dg-eyebrow" x="48" y="484">TOOL'S SANDBOX</text>
  <rect class="dg-zone is-boundary" x="480" y="464" width="224" height="104" rx="8"/>
  <text class="dg-eyebrow" x="496" y="484">SERVER'S SANDBOX</text>

  <!-- Edges: the agent's three ways out -->
  <path class="dg-edge" d="M240,76 H220 Q212,76 212,84 V254" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M336,104 V254" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M480,76 H574 Q582,76 582,84 V254" marker-end="url(#arrow)"/>

  <!-- Edge: the gateway forwards permitted requests out -->
  <path class="dg-edge" d="M384,256 V186" marker-end="url(#arrow)"/>
  <text class="dg-label" x="392" y="236">HTTP(S)</text>

  <!-- Edges: every entry point asks the policy engine -->
  <path class="dg-edge is-dashed" d="M212,312 V376 Q212,384 220,384 H262" marker-end="url(#arrow)"/>
  <path class="dg-edge is-dashed" d="M360,312 V350" marker-end="url(#arrow)"/>
  <path class="dg-edge is-dashed" d="M548,312 V376 Q548,384 540,384 H458" marker-end="url(#arrow)"/>

  <!-- Edges: permitted starts -->
  <path class="dg-edge" d="M176,312 V494" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M656,312 V494" marker-end="url(#arrow)"/>

  <!-- Nodes -->
  <rect class="dg-node" x="240" y="48" width="240" height="56" rx="6"/>
  <text class="dg-name" x="360" y="73" text-anchor="middle">Agent harness</text>
  <text class="dg-sub" x="360" y="91" text-anchor="middle">such as the Strands CLI</text>

  <rect class="dg-node is-input" x="360" y="136" width="184" height="48" rx="6"/>
  <text class="dg-name" x="452" y="165" text-anchor="middle">Allowed destinations</text>

  <rect class="dg-node" x="32" y="256" width="212" height="56" rx="6"/>
  <text class="dg-name" x="138" y="281" text-anchor="middle">Strands Shell and Monty</text>
  <text class="dg-code" x="138" y="299" text-anchor="middle">bash, python</text>

  <rect class="dg-node" x="288" y="256" width="144" height="56" rx="6"/>
  <text class="dg-name" x="360" y="281" text-anchor="middle">Egress gateway</text>
  <text class="dg-sub" x="360" y="299" text-anchor="middle">TLS, credentials</text>

  <rect class="dg-node" x="476" y="256" width="212" height="56" rx="6"/>
  <text class="dg-name" x="582" y="281" text-anchor="middle">MCP broker</text>
  <text class="dg-code" x="582" y="299" text-anchor="middle">tools/list, tools/call</text>

  <rect class="dg-node is-focal" x="264" y="352" width="192" height="64" rx="6"/>
  <text class="dg-name is-focal-text" x="360" y="381" text-anchor="middle">Dogwood policy engine</text>
  <text class="dg-sub" x="360" y="399" text-anchor="middle">decides each action</text>

  <rect class="dg-node" x="64" y="496" width="128" height="56" rx="6"/>
  <text class="dg-name" x="128" y="521" text-anchor="middle">Tools</text>
  <text class="dg-code" x="128" y="539" text-anchor="middle">git, aws</text>

  <rect class="dg-node" x="512" y="496" width="160" height="56" rx="6"/>
  <text class="dg-name" x="592" y="529" text-anchor="middle">Local MCP servers</text>
</svg>
