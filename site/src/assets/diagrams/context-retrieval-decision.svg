<svg xmlns="http://www.w3.org/2000/svg" class="context-retrieval-decision" viewBox="0 0 720 248" width="720" height="248">
  <!-- Type: decision fan-out. Story: the model answers from the preview when it can, and pays only for the matching lines when it can't. -->
  <!-- Standalone fallback: zero-specificity rules, so diagrams.css wins whenever the SVG is inlined on the site. -->
  <style>
    :where(.context-retrieval-decision) { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    :where(.context-retrieval-decision .dg-bg) { fill: #ffffff; }
    :where(.context-retrieval-decision .dg-node) { fill: #ffffff; stroke: rgba(0, 0, 0, 0.55); stroke-width: 1; }
    :where(.context-retrieval-decision .dg-node.is-input) { fill: #fafafa; stroke: #666464; }
    :where(.context-retrieval-decision .dg-node.is-focal) { fill: #e8f3ee; stroke: #007a3d; }
    :where(.context-retrieval-decision .dg-name) { fill: #000000; font-size: 14px; font-weight: 600; }
    :where(.context-retrieval-decision .is-focal-text) { fill: #007a3d; }
    :where(.context-retrieval-decision .dg-sub) { fill: #666464; font-size: 12px; }
    :where(.context-retrieval-decision .dg-code) { fill: #666464; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
    :where(.context-retrieval-decision .dg-label) { fill: #666464; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; letter-spacing: 0.06em; }
    :where(.context-retrieval-decision .dg-edge) { fill: none; stroke: #666464; stroke-width: 1.25; }
    :where(.context-retrieval-decision .dg-head) { fill: #666464; }
    :where(.context-retrieval-decision .dg-mask) { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
    :where(.context-retrieval-decision .dg-bg) { fill: #000000; }
    :where(.context-retrieval-decision .dg-node) { fill: #000000; stroke: rgba(255, 255, 255, 0.55); }
    :where(.context-retrieval-decision .dg-node.is-input) { fill: #0a0a0a; stroke: #999696; }
    :where(.context-retrieval-decision .dg-node.is-focal) { fill: #00120a; stroke: #00cc60; }
    :where(.context-retrieval-decision .dg-name) { fill: #ffffff; }
    :where(.context-retrieval-decision .is-focal-text) { fill: #00cc60; }
    :where(.context-retrieval-decision .dg-sub) { fill: #999696; }
    :where(.context-retrieval-decision .dg-code) { fill: #999696; }
    :where(.context-retrieval-decision .dg-label) { fill: #999696; }
    :where(.context-retrieval-decision .dg-edge) { stroke: #999696; }
    :where(.context-retrieval-decision .dg-head) { fill: #999696; }
    :where(.context-retrieval-decision .dg-mask) { fill: #000000; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>
  <rect class="dg-bg" width="720" height="248"/>

  <!-- Edges -->
  <path class="dg-edge" d="M216,96 Q224,96 224,88 V68 Q224,60 232,60 H318" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M216,128 Q224,128 224,136 V156 Q224,164 232,164 H302" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M464,164 H494" marker-end="url(#arrow)"/>

  <!-- Edge labels -->
  <rect class="dg-mask" x="206" y="40" width="112" height="12" rx="2"/>
  <text class="dg-label" x="262" y="49" text-anchor="middle">PREVIEW ENOUGH</text>
  <rect class="dg-mask" x="216" y="172" width="84" height="12" rx="2"/>
  <text class="dg-label" x="258" y="181" text-anchor="middle">NEEDS REST</text>

  <!-- Nodes -->
  <rect class="dg-node is-input" x="16" y="84" width="200" height="56" rx="6"/>
  <text class="dg-name" x="116" y="109" text-anchor="middle">Model reads a preview</text>
  <text class="dg-sub" x="116" y="127" text-anchor="middle">compacted block + reference</text>

  <rect class="dg-node" x="320" y="32" width="200" height="56" rx="6"/>
  <text class="dg-name" x="420" y="57" text-anchor="middle">Answer directly</text>
  <text class="dg-sub" x="420" y="75" text-anchor="middle">zero extra tokens</text>

  <rect class="dg-node is-focal" x="304" y="136" width="160" height="56" rx="6"/>
  <text class="dg-name is-focal-text" x="384" y="161" text-anchor="middle">Retrieve</text>
  <text class="dg-code" x="384" y="179" text-anchor="middle">retrieve_context(...)</text>

  <rect class="dg-node" x="496" y="136" width="208" height="56" rx="6"/>
  <text class="dg-name" x="600" y="161" text-anchor="middle">Matching lines only</text>
  <text class="dg-sub" x="600" y="179" text-anchor="middle">re-enter the context window</text>
</svg>
