<svg xmlns="http://www.w3.org/2000/svg" class="redteam-judge-vs-tool-check" viewBox="0 0 720 470" width="720" height="470">
  <!-- Type: grid. Story: the judge scored 8 of 15 attacks as defended, and the tool check flagged 7 of those 8. -->
  <!-- Standalone fallback: zero-specificity rules, so diagrams.css wins whenever the SVG is inlined on the site. -->
  <style>
    :where(.redteam-judge-vs-tool-check) { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    :where(.redteam-judge-vs-tool-check .dg-bg) { fill: #ffffff; }
    :where(.redteam-judge-vs-tool-check .dg-zone) { fill: #f7f7f7; stroke: rgba(0, 0, 0, 0.16); stroke-width: 1; }
    :where(.redteam-judge-vs-tool-check .dg-node.is-focal) { fill: #e8f3ee; stroke: #007a3d; stroke-width: 1; }
    :where(.redteam-judge-vs-tool-check .dg-name) { fill: #000000; font-size: 14px; font-weight: 600; }
    :where(.redteam-judge-vs-tool-check .dg-sub) { fill: #666464; font-size: 12px; }
    :where(.redteam-judge-vs-tool-check .dg-code), :where(.redteam-judge-vs-tool-check .dg-eyebrow) { fill: #666464; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    :where(.redteam-judge-vs-tool-check .dg-code) { font-size: 11.5px; }
    :where(.redteam-judge-vs-tool-check .dg-eyebrow) { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; }
    :where(.redteam-judge-vs-tool-check .is-danger-text) { fill: #c4161c; }
    @media (prefers-color-scheme: dark) {
    :where(.redteam-judge-vs-tool-check .dg-bg) { fill: #000000; }
    :where(.redteam-judge-vs-tool-check .dg-zone) { fill: #080808; stroke: rgba(255, 255, 255, 0.16); stroke-width: 1; }
    :where(.redteam-judge-vs-tool-check .dg-node.is-focal) { fill: #00120a; stroke: #00cc60; stroke-width: 1; }
    :where(.redteam-judge-vs-tool-check .dg-name) { fill: #ffffff; font-size: 14px; font-weight: 600; }
    :where(.redteam-judge-vs-tool-check .dg-sub) { fill: #999696; font-size: 12px; }
    :where(.redteam-judge-vs-tool-check .dg-code), :where(.redteam-judge-vs-tool-check .dg-eyebrow) { fill: #999696; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    :where(.redteam-judge-vs-tool-check .dg-code) { font-size: 11.5px; }
    :where(.redteam-judge-vs-tool-check .dg-eyebrow) { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; }
    :where(.redteam-judge-vs-tool-check .is-danger-text) { fill: #f7414c; }
    }
