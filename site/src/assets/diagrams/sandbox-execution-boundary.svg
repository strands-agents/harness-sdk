<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 184" width="720" height="184">
  <!-- Type: architecture with a boundary. Story: only execution operations cross into the sandbox; the agent's model calls, hooks, and state stay on your infrastructure. -->
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- Zones -->
  <rect class="dg-zone" x="16" y="24" width="384" height="144" rx="8"/>
  <text class="dg-eyebrow" x="32" y="44">AGENT RUNTIME · YOUR INFRASTRUCTURE</text>
  <rect class="dg-zone is-boundary" x="496" y="24" width="208" height="144" rx="8"/>
  <text class="dg-eyebrow" x="512" y="44">SANDBOX · YOU PROVISION</text>

  <!-- Edges (drawn before nodes) -->
  <path class="dg-edge" d="M192,104 H222" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M384,88 H510" marker-end="url(#arrow)"/>
  <path class="dg-edge is-dashed" d="M512,120 H386" marker-end="url(#arrow)"/>

  <!-- Edge labels (in the gap between the zones) -->
  <rect class="dg-mask" x="410" y="68" width="76" height="12" rx="2"/>
  <text class="dg-label" x="448" y="77" text-anchor="middle">OPERATIONS</text>
  <rect class="dg-mask" x="422" y="98" width="52" height="12" rx="2"/>
  <text class="dg-label" x="448" y="107.5" text-anchor="middle">OUTPUT</text>

  <!-- Nodes -->
  <rect class="dg-node" x="32" y="64" width="160" height="80" rx="6"/>
  <text class="dg-name" x="112" y="101" text-anchor="middle">Agent</text>
  <text class="dg-sub" x="112" y="119" text-anchor="middle">model, hooks, state</text>

  <rect class="dg-node" x="224" y="64" width="160" height="80" rx="6"/>
  <text class="dg-name" x="304" y="101" text-anchor="middle">Sandbox tools</text>
  <text class="dg-sub" x="304" y="119" text-anchor="middle">shell, file editor</text>

  <rect class="dg-node is-focal" x="512" y="64" width="176" height="80" rx="6"/>
  <text class="dg-name is-focal-text" x="600" y="101" text-anchor="middle">Execution backend</text>
  <text class="dg-sub" x="600" y="119" text-anchor="middle">Docker, SSH, or custom</text>
</svg>
