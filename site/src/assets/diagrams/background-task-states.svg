<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="720" height="384">
  <!-- Type: state machine. Story: an interrupt releases a slot and a response queues a fresh attempt. -->
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>

  <rect class="dg-zone" x="16" y="16" width="448" height="320" rx="8"/>
  <rect class="dg-zone" x="512" y="16" width="192" height="320" rx="8"/>
  <text class="dg-eyebrow" x="32" y="40">UNFINISHED</text>
  <text class="dg-eyebrow" x="528" y="40">TERMINAL</text>

  <path class="dg-edge" d="M176,116 H278" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M440,104 H480 Q488,104 488,96 V92 Q488,84 496,84 H534" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M440,128 H480 Q488,128 488,136 V160 Q488,168 496,168 H534" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M360,144 V242" marker-end="url(#arrow)"/>
  <path class="dg-edge is-dashed" d="M280,272 H112 Q104,272 104,264 V146" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M464,284 H534" marker-end="url(#arrow)"/>

  <text class="dg-label" x="228" y="104" text-anchor="middle">SLOT OPENS</text>
  <text class="dg-label" x="372" y="196">INTERRUPT</text>
  <text class="dg-label" x="192" y="260" text-anchor="middle">ALL RESPONSES</text>
  <rect class="dg-mask" x="468" y="264" width="64" height="12" rx="2"/>
  <text class="dg-label" x="500" y="272" text-anchor="middle">CANCEL ANY</text>

  <rect class="dg-node" x="32" y="88" width="144" height="56" rx="6"/>
  <text class="dg-code" x="104" y="113" text-anchor="middle">queued</text>
  <text class="dg-sub" x="104" y="131" text-anchor="middle">Waiting for a slot</text>

  <rect class="dg-node" x="280" y="88" width="160" height="56" rx="6"/>
  <text class="dg-code" x="360" y="113" text-anchor="middle">working</text>
  <text class="dg-sub" x="360" y="131" text-anchor="middle">Tool executing</text>

  <rect class="dg-node is-focal" x="280" y="244" width="160" height="56" rx="6"/>
  <text class="dg-code is-focal-text" x="360" y="269" text-anchor="middle">input_required</text>
  <text class="dg-sub" x="360" y="287" text-anchor="middle">Paused; slot released</text>

  <rect class="dg-node" x="536" y="56" width="152" height="56" rx="6"/>
  <text class="dg-code" x="612" y="81" text-anchor="middle">completed</text>
  <text class="dg-sub" x="612" y="99" text-anchor="middle">Tool succeeded</text>

  <rect class="dg-node" x="536" y="140" width="152" height="56" rx="6"/>
  <text class="dg-code" x="612" y="165" text-anchor="middle">failed</text>
  <text class="dg-sub" x="612" y="183" text-anchor="middle">Error or timeout</text>

  <rect class="dg-node" x="536" y="256" width="152" height="56" rx="6"/>
  <text class="dg-code" x="612" y="281" text-anchor="middle">cancelled</text>
  <text class="dg-sub" x="612" y="299" text-anchor="middle">Cancellation recorded</text>

  <text class="dg-note" x="24" y="364">After all responses, the tool is queued to restart with a fresh timeout.</text>
</svg>
