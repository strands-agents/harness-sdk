<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 284" width="720" height="284">
  <!-- Type: decision fan-out. Story: before a tool runs, the handler picks one of three outcomes; guide cancels the call and hands the agent feedback. -->
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head is-accent" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- Edges: fanned from the handler's right edge, r=8 elbows -->
  <path class="dg-edge" d="M144,148 H190" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M384,128 H392 Q400,128 400,120 V68 Q400,60 408,60 H494" marker-end="url(#arrow)"/>
  <path class="dg-edge is-accent" d="M384,148 H494" marker-end="url(#arrow-accent)"/>
  <path class="dg-edge" d="M384,168 H392 Q400,168 400,176 V228 Q400,236 408,236 H494" marker-end="url(#arrow)"/>

  <!-- Edge labels -->
  <text class="dg-label" x="452" y="49" text-anchor="middle">PROCEED</text>
  <text class="dg-label is-accent" x="452" y="137" text-anchor="middle">GUIDE</text>
  <text class="dg-label" x="452" y="225" text-anchor="middle">ASK A HUMAN</text>

  <!-- Nodes -->
  <rect class="dg-node is-input" x="16" y="116" width="128" height="64" rx="6"/>
  <text class="dg-name" x="80" y="145" text-anchor="middle">Tool call</text>
  <text class="dg-sub" x="80" y="163" text-anchor="middle">from the model</text>

  <rect class="dg-node is-focal" x="192" y="108" width="192" height="80" rx="6"/>
  <text class="dg-name is-focal-text" x="288" y="145" text-anchor="middle">Steering handler</text>
  <text class="dg-code" x="288" y="163" text-anchor="middle">BeforeToolCallEvent</text>

  <rect class="dg-node" x="496" y="28" width="208" height="64" rx="6"/>
  <text class="dg-name" x="600" y="57" text-anchor="middle">Tool runs</text>
  <text class="dg-sub" x="600" y="75" text-anchor="middle">executes immediately</text>

  <rect class="dg-node" x="496" y="116" width="208" height="64" rx="6"/>
  <text class="dg-name" x="600" y="145" text-anchor="middle">Tool cancelled</text>
  <text class="dg-sub" x="600" y="163" text-anchor="middle">agent gets the feedback</text>

  <rect class="dg-node" x="496" y="204" width="208" height="64" rx="6"/>
  <text class="dg-name" x="600" y="233" text-anchor="middle">Paused for a human</text>
  <text class="dg-sub" x="600" y="251" text-anchor="middle">awaits approval or input</text>
</svg>
