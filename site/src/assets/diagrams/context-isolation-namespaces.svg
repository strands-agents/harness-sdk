<svg xmlns="http://www.w3.org/2000/svg" class="context-isolation-namespaces" viewBox="0 0 720 232" width="720" height="232">
  <!-- Type: fan-out. Story: each sub-agent works in its own storage namespace, so no context bleeds between them. -->
  <!-- Standalone fallback: zero-specificity rules, so diagrams.css wins whenever the SVG is inlined on the site. -->
  <style>
    :where(.context-isolation-namespaces) { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    :where(.context-isolation-namespaces .dg-bg) { fill: #ffffff; }
    :where(.context-isolation-namespaces .dg-zone) { fill: #f7f7f7; stroke: rgba(0, 0, 0, 0.16); stroke-width: 1; }
    :where(.context-isolation-namespaces .dg-node) { fill: #ffffff; stroke: rgba(0, 0, 0, 0.55); stroke-width: 1; }
    :where(.context-isolation-namespaces .dg-node.is-focal) { fill: #e8f3ee; stroke: #007a3d; }
    :where(.context-isolation-namespaces .dg-name) { fill: #000000; font-size: 14px; font-weight: 600; }
    :where(.context-isolation-namespaces .is-focal-text) { fill: #007a3d; }
    :where(.context-isolation-namespaces .dg-sub) { fill: #666464; font-size: 12px; }
    :where(.context-isolation-namespaces .dg-code) { fill: #666464; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
    :where(.context-isolation-namespaces .dg-eyebrow) { fill: #666464; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; }
    :where(.context-isolation-namespaces .dg-edge) { fill: none; stroke: #666464; stroke-width: 1.25; }
    :where(.context-isolation-namespaces .dg-edge.is-dashed) { stroke-width: 1; stroke-dasharray: 4 3; }
    :where(.context-isolation-namespaces .dg-head) { fill: #666464; }
    @media (prefers-color-scheme: dark) {
    :where(.context-isolation-namespaces .dg-bg) { fill: #000000; }
    :where(.context-isolation-namespaces .dg-zone) { fill: #080808; stroke: rgba(255, 255, 255, 0.16); }
    :where(.context-isolation-namespaces .dg-node) { fill: #000000; stroke: rgba(255, 255, 255, 0.55); }
    :where(.context-isolation-namespaces .dg-node.is-focal) { fill: #00120a; stroke: #00cc60; }
    :where(.context-isolation-namespaces .dg-name) { fill: #ffffff; }
    :where(.context-isolation-namespaces .is-focal-text) { fill: #00cc60; }
    :where(.context-isolation-namespaces .dg-sub) { fill: #999696; }
    :where(.context-isolation-namespaces .dg-code) { fill: #999696; }
    :where(.context-isolation-namespaces .dg-eyebrow) { fill: #999696; }
    :where(.context-isolation-namespaces .dg-edge) { stroke: #999696; }
    :where(.context-isolation-namespaces .dg-head) { fill: #999696; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>
  <rect class="dg-bg" width="720" height="232"/>

  <!-- Zones -->
  <rect class="dg-zone" x="280" y="16" width="424" height="200" rx="8"/>
  <text class="dg-eyebrow" x="296" y="40">ONE NAMESPACE PER SUB-AGENT</text>

  <!-- Edges -->
  <path class="dg-edge" d="M192,100 Q200,100 200,92 V88 Q200,80 208,80 H302" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M192,124 Q200,124 200,132 V160 Q200,168 208,168 H302" marker-end="url(#arrow)"/>
  <path class="dg-edge is-dashed" d="M448,80 H494" marker-end="url(#arrow)"/>
  <path class="dg-edge is-dashed" d="M448,168 H494" marker-end="url(#arrow)"/>

  <!-- Nodes -->
  <rect class="dg-node is-focal" x="16" y="72" width="176" height="80" rx="6"/>
  <text class="dg-name is-focal-text" x="104" y="109" text-anchor="middle">Orchestrator</text>
  <text class="dg-sub" x="104" y="127" text-anchor="middle">launches isolated tasks</text>

  <rect class="dg-node" x="304" y="52" width="144" height="56" rx="6"/>
  <text class="dg-name" x="376" y="85" text-anchor="middle">Researcher</text>

  <rect class="dg-node" x="304" y="140" width="144" height="56" rx="6"/>
  <text class="dg-name" x="376" y="173" text-anchor="middle">Writer</text>

  <rect class="dg-node" x="496" y="52" width="192" height="56" rx="6"/>
  <text class="dg-name" x="592" y="77" text-anchor="middle">Own storage</text>
  <text class="dg-code" x="592" y="95" text-anchor="middle">./.strands/researcher</text>

  <rect class="dg-node" x="496" y="140" width="192" height="56" rx="6"/>
  <text class="dg-name" x="592" y="165" text-anchor="middle">Own storage</text>
  <text class="dg-code" x="592" y="183" text-anchor="middle">./.strands/writer</text>
</svg>
