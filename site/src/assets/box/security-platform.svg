<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1241px" height="703px" viewBox="0 0 1241 703"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="paper"><g><rect x="0" y="0" width="1240" height="702" fill="#ffffff" stroke="#ffffff" stroke-width="0.1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(255, 255, 255);"/></g></g><g data-cell-id="c3"><g><rect x="36" y="24" width="1168" height="42" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20323D" font-family="Arial" font-weight="bold" text-anchor="start" font-size="29px" style="fill: rgb(32, 50, 61);"><text x="36" y="58.5">When a platform provides customer isolation</text></g></g></g><g data-cell-id="c4"><g><rect x="36" y="74" width="1168" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#52646F" font-family="Arial" text-anchor="start" font-size="18px" style="fill: rgb(82, 100, 111);"><text x="36" y="96">Illustrative hosted deployment. Verify the selected platform's guarantees.</text></g></g></g><g data-cell-id="customer-A"><g transform="translate(0.5,0.5)"><rect x="36" y="145" width="544" height="375" fill="#fcf5e8" stroke="#a67b38" stroke-width="2.5" pointer-events="all" style="fill: rgb(252, 245, 232); stroke: rgb(166, 123, 56);"/></g></g><g data-cell-id="c6"><g><rect x="60" y="164" width="492" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20323D" font-family="Arial" font-weight="bold" text-anchor="start" font-size="23px" style="fill: rgb(32, 50, 61);"><text x="60" y="190.5">Customer A environment</text></g></g></g><g data-cell-id="c7"><g><rect x="60" y="205" width="492" height="27" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#52646F" font-family="Arial" text-anchor="start" font-size="17px" style="fill: rgb(82, 100, 111);"><text x="60" y="226">Platform provides the enclosing isolation.</text></g></g></g><g data-cell-id="trusted-A"><g><rect x="60" y="258" width="496" height="82" fill="#ffffff" stroke="#20323d" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(32, 50, 61);"/></g></g><g data-cell-id="c9"><g><rect x="72" y="268" width="472" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20323D" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="20px" style="fill: rgb(32, 50, 61);"><text x="308" y="292">Trusted Box process</text></g></g></g><g data-cell-id="c10"><g><rect x="72" y="303" width="472" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#52646F" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: rgb(82, 100, 111);"><text x="308" y="321">Outside the process-containment boundaries below</text></g></g></g><g data-cell-id="A-24"><g><rect x="60" y="386" width="236" height="101" fill="#eaf4f8" stroke="#236a89" stroke-width="2" pointer-events="all" style="fill: rgb(234, 244, 248); stroke: rgb(35, 106, 137);"/></g></g><g data-cell-id="c12"><g><rect x="68" y="399" width="220" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#236A89" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(35, 106, 137);"><text x="178" y="421">Agent containment</text></g></g></g><g data-cell-id="c13"><g><rect x="68" y="440" width="220" height="23" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20323D" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: rgb(32, 50, 61);"><text x="178" y="458.5">Agent + native children</text></g></g></g><g data-cell-id="A-284"><g><rect x="320" y="386" width="236" height="101" fill="#eaf4f8" stroke="#236a89" stroke-width="2" pointer-events="all" style="fill: rgb(234, 244, 248); stroke: rgb(35, 106, 137);"/></g></g><g data-cell-id="c15"><g><rect x="328" y="399" width="220" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#236A89" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(35, 106, 137);"><text x="438" y="421">Leaf containment</text></g></g></g><g data-cell-id="c16"><g><rect x="328" y="440" width="220" height="23" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20323D" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: rgb(32, 50, 61);"><text x="438" y="458.5">Tool or local server</text></g></g></g><g data-cell-id="customer-B"><g transform="translate(0.5,0.5)"><rect x="660" y="145" width="544" height="375" fill="#fcf5e8" stroke="#a67b38" stroke-width="2.5" pointer-events="all" style="fill: rgb(252, 245, 232); stroke: rgb(166, 123, 56);"/></g></g><g data-cell-id="c18"><g><rect x="684" y="164" width="492" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20323D" font-family="Arial" font-weight="bold" text-anchor="start" font-size="23px" style="fill: rgb(32, 50, 61);"><text x="684" y="190.5">Customer B environment</text></g></g></g><g data-cell-id="c19"><g><rect x="684" y="205" width="492" height="27" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#52646F" font-family="Arial" text-anchor="start" font-size="17px" style="fill: rgb(82, 100, 111);"><text x="684" y="226">Platform provides the enclosing isolation.</text></g></g></g><g data-cell-id="trusted-B"><g><rect x="684" y="258" width="496" height="82" fill="#ffffff" stroke="#20323d" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(32, 50, 61);"/></g></g><g data-cell-id="c21"><g><rect x="696" y="268" width="472" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20323D" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="20px" style="fill: rgb(32, 50, 61);"><text x="932" y="292">Trusted Box process</text></g></g></g><g data-cell-id="c22"><g><rect x="696" y="303" width="472" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#52646F" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: rgb(82, 100, 111);"><text x="932" y="321">Outside the process-containment boundaries below</text></g></g></g><g data-cell-id="B-24"><g><rect x="684" y="386" width="236" height="101" fill="#eaf4f8" stroke="#236a89" stroke-width="2" pointer-events="all" style="fill: rgb(234, 244, 248); stroke: rgb(35, 106, 137);"/></g></g><g data-cell-id="c24"><g><rect x="692" y="399" width="220" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#236A89" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(35, 106, 137);"><text x="802" y="421">Agent containment</text></g></g></g><g data-cell-id="c25"><g><rect x="692" y="440" width="220" height="23" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20323D" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: rgb(32, 50, 61);"><text x="802" y="458.5">Agent + native children</text></g></g></g><g data-cell-id="B-284"><g><rect x="944" y="386" width="236" height="101" fill="#eaf4f8" stroke="#236a89" stroke-width="2" pointer-events="all" style="fill: rgb(234, 244, 248); stroke: rgb(35, 106, 137);"/></g></g><g data-cell-id="c27"><g><rect x="952" y="399" width="220" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#236A89" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(35, 106, 137);"><text x="1062" y="421">Leaf containment</text></g></g></g><g data-cell-id="c28"><g><rect x="952" y="440" width="220" height="23" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20323D" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: rgb(32, 50, 61);"><text x="1062" y="458.5">Tool or local server</text></g></g></g><g data-cell-id="divider"><g><rect x="619" y="170" width="2" height="321" fill="#a67b38" stroke="#a67b38" stroke-width="0.1" pointer-events="all" style="fill: rgb(166, 123, 56); stroke: rgb(166, 123, 56);"/></g></g><g data-cell-id="c30"><g><rect x="60" y="551" width="1120" height="33" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20323D" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="23px" style="fill: rgb(32, 50, 61);"><text x="620" y="578">Isolation between customers belongs to the platform.</text></g></g></g><g data-cell-id="c31"><g><rect x="60" y="595" width="1120" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20323D" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(32, 50, 61);"><text x="620" y="617">Box restricts processes inside each environment. Box supplies no isolation guarantee between customers.</text></g></g></g><g data-cell-id="c32"><g><rect x="36" y="653" width="1168" height="27" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#52646F" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(82, 100, 111);"><text x="36" y="673.5">Gold: platform isolation. Blue: process containment. White: trusted Box code outside process containment.</text></g></g></g></g></g></g></svg>