[package]
name = "strands-macros"
description = "Procedural macros for the Strands Agents Rust SDK (#[tool], #[tools])"
readme = "../strands/README.md"
keywords = ["agents", "ai", "strands", "macros"]
categories = ["development-tools::procedural-macro-helpers"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
proc-macro = true

[dependencies]
darling.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["visit"] }

[dev-dependencies]
serde_json.workspace = true
# Path-only, so packaging drops it and the two crates can publish in order.
strands = { path = "../strands", default-features = false }

[lints]
workspace = true
